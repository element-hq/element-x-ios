name: Unit Tests

on:
  workflow_dispatch:
  
  push:
    branches: [ develop ]
  
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: macos-26

    concurrency:
      # Only allow a single run of this workflow on each branch, automatically cancelling older runs.
      group: ${{ format('unit-tests-{0}', github.ref) }}
      cancel-in-progress: true

    steps:
      - uses: nschloe/action-cached-lfs-checkout@f46300cd8952454b9f0a21a3d133d4bd5684cfc2 #v1.2.3

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Setup environment
        run:
          source ci_scripts/ci_common.sh && setup_github_actions_environment

      - name: Install iOS 18.6 simulator runtime
        run: |
          # The macos-26 image only ships iOS 26.x simulators, but the unit and
          # preview tests are pinned to iOS 18.6 (the committed snapshots were
          # recorded on that runtime, enforced by PreviewTests.checkEnvironments).
          if ! xcrun simctl list runtimes | grep -q "iOS 18.6"; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
          RUNTIME_ID=$(xcrun simctl list -j runtimes | jq -r '.runtimes[] | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-18-6")) | .identifier' | head -n 1)
          if [ -z "$RUNTIME_ID" ]; then
            echo "The iOS 18.6 simulator runtime is not available." >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
          ensure_device() {
            if ! xcrun simctl list -j devices | jq -e --arg rt "$RUNTIME_ID" --arg name "$1" '.devices[$rt] // [] | map(select(.name == $name)) | length > 0' > /dev/null; then
              xcrun simctl create "$1" "$2" "$RUNTIME_ID"
            fi
          }
          ensure_device "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16"
          ensure_device "iPhone SE (3rd generation)" "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation"
          xcrun simctl list devices "iOS 18.6"

      - name: SwiftFormat
        run:
          swiftformat --lint .
      
      - name: Run tests
        run: bundle exec fastlane unit_tests

      - name: Collect recorded snapshots # TEMPORARY: remove together with the RECORD_FAILURES test plan change
        if: ${{ !cancelled() }}
        run: |
          mkdir -p recorded-snapshots
          git status --porcelain -- PreviewTests/Sources/__Snapshots__ | tee recorded-snapshots/status.txt
          git status --porcelain -z -- PreviewTests/Sources/__Snapshots__ | while IFS= read -r -d '' entry; do
            path="${entry:3}"
            if [ -f "$path" ]; then
              mkdir -p "recorded-snapshots/$(dirname "$path")"
              cp "$path" "recorded-snapshots/$path"
            fi
          done

      - name: Upload recorded snapshots # TEMPORARY: remove together with the RECORD_FAILURES test plan change
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: RecordedSnapshots
          path: recorded-snapshots
          retention-days: 1
          if-no-files-found: warn

      - name: Zip results # for faster upload
        if: failure()
        working-directory: fastlane/test_output
        run: zip -r UnitTests.zip UnitTests.xcresult PreviewTests.xcresult
      
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        # We only care about artefacts if the tests fail
        if: failure()
        with:
            name: Results
            path: fastlane/test_output/UnitTests.zip
            retention-days: 1
            if-no-files-found: ignore
      
      - name: Collect coverage
        run: |
          xcresultparser -q -o cobertura -t ElementX -p $(pwd) fastlane/test_output/UnitTests.xcresult > fastlane/test_output/unit-cobertura.xml
          xcresultparser -q -o cobertura -t ElementX -p $(pwd) fastlane/test_output/PreviewTests.xcresult > fastlane/test_output/preview-cobertura.xml
      
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }} # Skip in forks
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        continue-on-error: true # No CODECOV_TOKEN is configured for this repo yet; don't block CI on upload issues.
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests

      - name: Collect test results
        if: ${{ !cancelled() }}
        run: |
          # A result bundle can be missing when the test step aborts early (e.g. failing unit
          # tests stop the lane before the preview tests run). Only parse what exists so this
          # step doesn't mask the real failure with an xcresultparser error.
          if [ -d fastlane/test_output/UnitTests.xcresult ]; then
            xcresultparser -q -o junit -p $(pwd) fastlane/test_output/UnitTests.xcresult > fastlane/test_output/unit-junit.xml
          fi
          if [ -d fastlane/test_output/PreviewTests.xcresult ]; then
            xcresultparser -q -o junit -p $(pwd) fastlane/test_output/PreviewTests.xcresult > fastlane/test_output/preview-junit.xml
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1.1.1
        continue-on-error: true
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
