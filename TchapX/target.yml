name: TchapX
#--------------------------------------------------------------------------------
schemeTemplates:
  BaseScheme:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ${scheme_name}:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ${scheme_name}:
#--------------------------------------------------------------------------------
schemes:
  TchapX-Production:
    templates:
      - BaseScheme
    test:
      testPlans:
        - path: UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true
        - path: UITests/SupportingFiles/UITests.xctestplan
          defaultPlan: false
        - path: PreviewTests/SupportingFiles/PreviewTests.xctestplan
          defaultPlan: false
  TchapX-Preprod:
    templates:
      - BaseScheme
    test:
      testPlans:
        - path: UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true
        - path: UITests/SupportingFiles/UITests.xctestplan
          defaultPlan: false
        - path: PreviewTests/SupportingFiles/PreviewTests.xctestplan
          defaultPlan: false
  TchapX-Development:
    templates:
      - BaseScheme
    test:
      testPlans:
        - path: UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true
        - path: UITests/SupportingFiles/UITests.xctestplan
          defaultPlan: false
        - path: PreviewTests/SupportingFiles/PreviewTests.xctestplan
          defaultPlan: false
#--------------------------------------------------------------------------------
targetTemplates:
  BaseTarget:
    type: application
    platform: iOS

    info:
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [
          {
            CFBundleTypeRole: Editor,
            CFBundleURLName: "Application",
            CFBundleURLSchemes: [
              $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
              "matrix" # Matrix URI scheme for permalinks
            ]
          }
        ]
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: true
        }
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        classicAppGroupIdentifier: $(CLASSIC_APP_GROUP_IDENTIFIER)
        classicAppKeychainServiceIdentifier: $(CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER)
        classicAppKeychainAccessGroupIdentifier: $(CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        classicAppDeepLinkURL: $(CLASSIC_APP_DEEP_LINK_URL)
        productionAppName: $(PRODUCTION_APP_NAME)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [
          INSendMessageIntent,
          INStartCallIntent,
        ]
        NSCameraUsageDescription: To take pictures or videos and send them as a message $(APP_DISPLAY_NAME) needs access to the camera.
        NSMicrophoneUsageDescription: To record and send messages with audio, $(APP_DISPLAY_NAME) needs to access the microphone.
        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
        NSLocationWhenInUseUsageDescription: Grant location access so that $(APP_DISPLAY_NAME) can share your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: To share your live location, $(APP_DISPLAY_NAME) needs location access when the app is in the background.
        NSFaceIDUsageDescription: Face ID is used to access your app.
        UIBackgroundModes: [
          audio,
          fetch,
          processing,
          voip,
          location
        ]
        UTExportedTypeDeclarations:
        - UTTypeConformsTo: [public.text]
          UTTypeDescription: Mention Pills
          UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
        - CFBundleTypeName: Mention Pills
          CFBundleTypeRole: Viewer
          LSHandlerRank: Owner
          LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false
        
    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        - $(CLASSIC_APP_GROUP_IDENTIFIER)
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        - $(CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

        
    settings:
      BASE_APP_GROUP_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
      APP_GROUP_IDENTIFIER: group.$(BASE_APP_GROUP_IDENTIFIER)
      KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(AppIdentifierPrefix)$(BASE_BUNDLE_IDENTIFIER)"
      PRODUCT_NAME: $(APP_NAME)
      PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
      ASSETCATALOG_COMPILER_APPICON_NAME: TchapX-icon
      SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
      SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
      PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
      SWIFT_VERSION: 6.2
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

    preBuildScripts:
    - name: 🧙 Sourcery - Generate mocks
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    postBuildScripts:
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftlint >/dev/null; then
            swiftlint
        else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
        fi
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftformat >/dev/null; then
            swiftformat --lint --lenient "$PROJECT_DIR"
        else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
        fi

    dependencies:
    - target: MatrixRustSDKMocks
    - package: MatrixRustSDK
      embed: true
    - package: Compound
    - package: BuildExtensions
      product: Macros
    - package: Algorithms
    - package: AsyncAlgorithms
    - package: AnalyticsEvents
    - package: Collections
    - package: DeviceKit
    - package: EmbeddedElementCall
    - package: KeychainAccess
    - package: Kingfisher
    - package: KZFileWatchers
    - package: LoremSwiftum
    - package: LRUCache
    - package: Mantis
    - target: MapLibreInterface
      embed: true
    # Embedded but not linked, dlopen'd on first map use
    - target: MapLibreShim
      link: false
      embed: true
    # The app just embeds the framework so it's in the bundle for the shim's load 
    # command to resolve against.
    - framework: ../MapLibre.framework
      implicit: true
      link: false
      embed: true
    - package: ElementCall
      product: ElementCall
    - package: PostHog
    - package: SwiftState
    - package: GZIP
    - package: Sentry
      products: 
        - Sentry
        - SentrySwiftUI
    - package: Version
    - package: Emojibase
    - package: WysiwygComposer
    - package: SwiftOGG
    - package: SwiftSoup
    - package: SwiftFlow
      product: Flow
    - package: DSWaveformImage
      product: DSWaveformImageViews

    sources:
    - path: ../ElementX/Sources
      excludes:
        - Other/Extensions/XCTestCase.swift
        - Other/Extensions/XCUIElement.swift
    - path: ../Components/Secrets/Secrets.swift
    - path: main/Sources
      excludes:
        - Other/Extensions/XCUIElement.swift
    - path: main/Resources
    - path: ../ElementX/Resources
    - path: ../ElementX/SupportingFiles/Settings.bundle
    - path: ../Tools/Scripts/Templates/SimpleScreenExample/ElementX
    - path: ../Components/DevelopmentAssets/Media

    # This is required for testing purposes... The problem with unit tests is that if you
    # try to `@testable import NSE` you can only get the definition of files, but due to a
    # limitation in how they work, they can only compile files that are part of the main test
    # target, so linking will fail. The solution is to just have the main app to reference the
    # extension code, and test it directly.
    - path: ../NSE/Sources

#--------------------------------------------------------------------------------
targets:
#--------------------------------------------------------------------------------
  TchapX-Production:
    templates: 
      - BaseTarget

    configFiles:
      Debug: production/SupportingFiles/secrets.xcconfig
      Release: production/SupportingFiles/secrets.xcconfig

    info:
      path: production/SupportingFiles/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh
        ]
        NSAppTransportSecurity: {
          NSPinnedDomains: {
            # Download the Intermediate Service CA certificate from your browser from url `https://tchap.gouv.fr` (as `.pem` file).
            # Remove line breaks and paste it in below `PEM` property.
            # Generate SPKI: cat <certificate.pem> | openssl x509 -inform pem -noout -outform pem -pubkey | openssl pkey -pubin -inform pem -outform der | openssl dgst -sha256 -binary | openssl enc -base64
            # Copy printed output in below `SPKI-SHA256-BASE64` property.
            "tchap.gouv.fr": {
              NSIncludesSubdomains: true,
              NSPinnedCAIdentities: [
                {
                  "SPKI-SHA256-BASE64": "kGxKeLInUl4Q9pvlALRV0c2jCDMtv5OZYa/lU99H6bo=",
                  "PEM": "-----BEGIN CERTIFICATE----------END CERTIFICATE-----"
                }
             ]
            #},
            # Download the Intermediate Service CA certificate from your browser from url `https://openmaptiles.geo.data.gouv.fr` (as `.pem` file).
            # Remove line breaks and paste it in below `PEM` property.
            # Generate SPKI: cat <certificate.pem> | openssl x509 -inform pem -noout -outform pem -pubkey | openssl pkey -pubin -inform pem -outform der | openssl dgst -sha256 -binary | openssl enc -base64
            # Copy printed output in below `SPKI-SHA256-BASE64` property.
            #"openmaptiles.geo.data.gouv.fr": {
            #  NSIncludesSubdomains: true,
            #  NSPinnedCAIdentities: [
            #    "SPKI-SHA256-BASE64": "5JA76xhFakdvHHlo2H5FqC3Ixf5HGrLq6YkNn7JDMeU=",
            #    "PEM": "-----BEGIN CERTIFICATE----------END CERTIFICATE-----"
            # ]
            }
          }
        }

    entitlements:
      path: production/SupportingFiles/tchapx.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:tchap.gouv.fr
        - applinks:www.tchap.gouv.fr
        # - applinks:localhost?mode=developer # developer mode only works with https (but self-signed is fine).
        - webcredentials:www.tchap.gouv.fr

    settings:
      BASE_BUNDLE_IDENTIFIER: fr.gouv.tchapx
      PRODUCTION_APP_NAME: TchapX PRODUCTION
      APP_NAME: TchapX-Production
      APP_DISPLAY_NAME: Tchap # The name used in the application.
      CODE_SIGN_ENTITLEMENTS: TchapX/production/SupportingFiles/tchapx.entitlements
      OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_TCHAP_PRODUCTION

      # configuration to load accounts from Tchap Classic.
      CLASSIC_APP_GROUP_IDENTIFIER: group.fr.gouv.tchap
      CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: fr.gouv.tchap.encryption-manager-service
      CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).fr.gouv.tchap.keychain.shared"
      CLASSIC_APP_DEEP_LINK_URL: "tchap://open"

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
            swiftgen config run --config "Tools/SwiftGen/swiftgen-config-tchap-main.yml"
            # inject Xcode target into switgen-config-tchap yaml file.
            source_file="Tools/SwiftGen/swiftgen-config-tchap-target.yml"
            target_file="Tools/SwiftGen/swiftgen-config-tchap-target.tmp"
            scheme="production"
            rm -f $target_file
            sed "s/%TARGET%/${scheme}/" $source_file > $target_file
            swiftgen config run --config $target_file
            rm -f $target_file
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi

    dependencies:
    - target: TchapX-Production-NSE
    - target: TchapX-Production-ShareExtension

    sources:
    - path: production/Resources
    - path: production/SupportingFiles
      excludes:
        - target.yml
        - NSE
#--------------------------------------------------------------------------------
  TchapX-Preprod:
    templates: 
      - BaseTarget

    configFiles:
      Debug: preprod/SupportingFiles/secrets.xcconfig
      Release: preprod/SupportingFiles/secrets.xcconfig

    info:
      path: preprod/SupportingFiles/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh
        ]
        NSAppTransportSecurity: {
          NSPinnedDomains: {
            # Download the Intermediate Service CA certificate from your browser from url `https://beta.tchap.gouv.fr` (as `.pem` file).
            # Remove line breaks and paste it in below `PEM` property.
            # Generate SPKI: cat <certificate.pem> | openssl x509 -inform pem -noout -outform pem -pubkey | openssl pkey -pubin -inform pem -outform der | openssl dgst -sha256 -binary | openssl enc -base64
            # Copy printed output in below `SPKI-SHA256-BASE64` property.
            "tchap.gouv.fr": {
              NSIncludesSubdomains: true,
              NSPinnedCAIdentities: [
                {
                  "SPKI-SHA256-BASE64": "kGxKeLInUl4Q9pvlALRV0c2jCDMtv5OZYa/lU99H6bo=",
                  "PEM": "-----BEGIN CERTIFICATE----------END CERTIFICATE-----"
                }
             ]
            #},
            # Download the Intermediate Service CA certificate from your browser from url `https://openmaptiles.geo.data.gouv.fr` (as `.pem` file).
            # Remove line breaks and paste it in below `PEM` property.
            # Generate SPKI: cat <certificate.pem> | openssl x509 -inform pem -noout -outform pem -pubkey | openssl pkey -pubin -inform pem -outform der | openssl dgst -sha256 -binary | openssl enc -base64
            # Copy printed output in below `SPKI-SHA256-BASE64` property.
            #"openmaptiles.geo.data.gouv.fr": {
            #  NSIncludesSubdomains: true,
            #  NSPinnedCAIdentities: [
            #    "SPKI-SHA256-BASE64": "5JA76xhFakdvHHlo2H5FqC3Ixf5HGrLq6YkNn7JDMeU=",
            #    "PEM": "-----BEGIN CERTIFICATE----------END CERTIFICATE-----"
            # ]
            }
          }
        }

    entitlements:
      path: preprod/SupportingFiles/tchapx.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:beta.tchap.gouv.fr
        - applinks:www.beta.tchap.gouv.fr
        # - applinks:localhost?mode=developer # developer mode only works with https (but self-signed is fine).
        - webcredentials:www.beta.tchap.gouv.fr

    settings:
      BASE_BUNDLE_IDENTIFIER: fr.gouv.tchapx.staging
      PRODUCTION_APP_NAME: TchapX PREPROD
      APP_NAME: TchapX-Preprod
      APP_DISPLAY_NAME: Tchap Preprod # The name used in the application.
      CODE_SIGN_ENTITLEMENTS: TchapX/preprod/SupportingFiles/tchapx.entitlements
      OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_TCHAP_PREPROD

      # configuration to load accounts from Tchap Classic.
      CLASSIC_APP_GROUP_IDENTIFIER: group.fr.gouv.btchap
      CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: fr.gouv.btchap.encryption-manager-service
      CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).fr.gouv.btchap.keychain.shared"
      CLASSIC_APP_DEEP_LINK_URL: "tchap://open"

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config "Tools/SwiftGen/swiftgen-config-tchap-main.yml"
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
            # inject Xcode target into switgen-config-tchap yaml file.
            source_file="Tools/SwiftGen/swiftgen-config-tchap-target.yml"
            target_file="Tools/SwiftGen/swiftgen-config-tchap-target.tmp"
            scheme="preprod"
            rm -f $target_file
            sed "s/%TARGET%/${scheme}/" $source_file > $target_file
            swiftgen config run --config $target_file
            rm -f $target_file
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi

    dependencies:
    - target: TchapX-Preprod-NSE
    - target: TchapX-Preprod-ShareExtension

    sources:
    - path: preprod/Resources
    - path: preprod/SupportingFiles
      excludes:
        - target.yml
        - NSE
#--------------------------------------------------------------------------------
  TchapX-Development:
    templates: 
      - BaseTarget

    configFiles:
      Debug: development/SupportingFiles/secrets.xcconfig
      Release: development/SupportingFiles/secrets.xcconfig

    info:
      path: development/SupportingFiles/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh
        ]
        # No certificate pinning in Development environment.
        NSAppTransportSecurity: {
          NSPinnedDomains: {
          }
        }

    entitlements:
      path: development/SupportingFiles/tchapx.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:tchap.incubateur.net
        - applinks:www.tchap.incubateur.net
        # - applinks:localhost?mode=developer # developer mode only works with https (but self-signed is fine).
        - webcredentials:www.tchap.incubateur.net

    settings:
      BASE_BUNDLE_IDENTIFIER: fr.gouv.tchapx.dev
      PRODUCTION_APP_NAME: TchapX DEVELOPMENT
      APP_NAME: TchapX-Development
      APP_DISPLAY_NAME: Tchap Dev # The name used in the application.
      CODE_SIGN_ENTITLEMENTS: TchapX/development/SupportingFiles/tchapx.entitlements
      OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_TCHAP_DEVELOPMENT

      # configuration to load accounts from Tchap Classic.
      CLASSIC_APP_GROUP_IDENTIFIER: group.fr.gouv.tchap.dev
      CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: fr.gouv.tchap.dev.encryption-manager-service
      CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).fr.gouv.tchap.dev.keychain.shared"
      CLASSIC_APP_DEEP_LINK_URL: "tchap://open"
  
    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config "Tools/SwiftGen/swiftgen-config-tchap-main.yml"
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
            # inject Xcode target into switgen-config-tchap yaml file.
            source_file="Tools/SwiftGen/swiftgen-config-tchap-target.yml"
            target_file="Tools/SwiftGen/swiftgen-config-tchap-target.tmp"
            scheme="development"
            rm -f $target_file
            sed "s/%TARGET%/${scheme}/" $source_file > $target_file
            swiftgen config run --config $target_file
            rm -f $target_file
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi

    dependencies:
    - target: TchapX-Development-NSE
    - target: TchapX-Development-ShareExtension

    sources:
    - path: development/Resources
    - path: development/SupportingFiles
      excludes:
        - target.yml
        - NSE